<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 04: The CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h2>Box Model Comparison</h2>

        <!-- Box 1: content-box -->
        <div class="box box-content-box">
            <h3>Content-Box</h3>
            <p>Declared width: 300px</p>
            <p>Actual rendered width: 360px</p>
        </div>

        <!-- Box 2: border-box -->
        <div class="box box-border-box">
            <h3>Border-Box</h3>
            <p>Declared width: 300px</p>
            <p>Actual rendered width: 300px</p>
        </div>
    </main>

</body>
</html>
